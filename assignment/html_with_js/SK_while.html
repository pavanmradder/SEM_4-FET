<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#141e30,#243b55);
}

.container{
    width:350px;
    padding:35px;
    background:white;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
    color:#243b55;
    margin-bottom:15px;
}

#status{
    color:#555;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#243b55;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#homepage{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#a9abd8;
    border-radius:20px;
    text-decoration:none;
    color:black;
}

</style>
</head>
<body>
<div class="container">
    <h1>🔐 System Login</h1>
    <h3 id="status">Click button to login</h3>
    <button id="loginBtn">Enter Password</button><br>
    <a id="homepage"href="https://pavanmradder.github.io/SEM_4-FET/">Home Page</a>
</div>

<script>
let btn = document.getElementById("loginBtn");
let statusText = document.getElementById("status");
btn.addEventListener("click", ()=>{
    let start;
    do{
        start = prompt("Type YES to start login");
    }
    while(start.toLowerCase() !== "yes");
    let attempts = 3;
    while(attempts > 0){
        let password = prompt("Enter Password");
        if(password === "@123"){
            alert("Login Successful!");
            statusText.textContent = "✅ Login Successful!";
            statusText.style.color = "green";
            btn.style.display = "none";
            break;
        }
        else{
            attempts--;
            if(attempts > 0){
                alert("❌ Wrong Password!");
                alert(`You have ${attempts} attempts left`);
            }
            else{
                alert("🚫 Login Failed!");
                statusText.textContent = "❌ Login Failed!";
                statusText.style.color = "red";
                btn.style.display = "none";
            }
        }
    }
});
</script>
</body>
</html>
